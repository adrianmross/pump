apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/checkout-api:v2.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
spec:
  ports:
    - port: 80
