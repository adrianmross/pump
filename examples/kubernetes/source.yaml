apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  labels:
    app.kubernetes.io/name: billing-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-api
    spec:
      containers:
        - name: billing-api
          image: ghcr.io/example/billing-api:v1.4.2
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/worker:v1.4.2
