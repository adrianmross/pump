rules:
  - name: object-labels
    match: "$.metadata"
    defaults:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: checkout
        app.kubernetes.io/team: payments
    overrides:
      labels:
        app.kubernetes.io/managed-by: pump
  - name: deployment-shape
    match: "$.spec"
    apiVersion: apps/v1
    kind: Deployment
    metadataName: checkout-api
    defaults:
      replicas: 2
      selector:
        matchLabels:
          app.kubernetes.io/name: checkout-api
  - name: pod-template-shape
    match: "$.spec.template"
    apiVersion: apps/v1
    kind: Deployment
    metadataName: checkout-api
    defaults:
      metadata:
        labels:
          app.kubernetes.io/name: checkout-api
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  - name: container-defaults
    match: "$.spec.template.spec.containers.*"
    apiVersion: apps/v1
    kind: Deployment
    metadataName: checkout-api
    defaults:
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  - name: service-shape
    match: "$.spec"
    apiVersion: v1
    kind: Service
    metadataName: checkout-api
    defaults:
      selector:
        app.kubernetes.io/name: checkout-api
      type: ClusterIP
  - name: service-port-defaults
    match: "$.spec.ports.*"
    apiVersion: v1
    kind: Service
    metadataName: checkout-api
    defaults:
      name: http
      protocol: TCP
      targetPort: 8080
