---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: checkout
    app.kubernetes.io/team: payments
    app.kubernetes.io/managed-by: pump
spec:
  template:
    spec:
      containers:
        - name: api
          image: "ghcr.io/acme/checkout-api:v2.1.0"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
          imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: checkout
    app.kubernetes.io/team: payments
    app.kubernetes.io/managed-by: pump
spec:
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: checkout-api
  type: ClusterIP
