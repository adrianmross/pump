---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  labels:
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/managed-by: pump
    platform.example.com/tier: api
    app.kubernetes.io/part-of: billing
  annotations: {}
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-api
    spec:
      containers:
      - name: billing-api
        image: ghcr.io/example/billing-api:v1.4.2
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: '250m'
            memory: '128Mi'
        imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    platform.example.com/tier: worker
    app.kubernetes.io/part-of: billing
    app.kubernetes.io/managed-by: pump
  annotations: {}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/example/worker:v1.4.2
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: '100m'
            memory: '128Mi'
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  replicas: 2
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  labels:
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/part-of: billing
    app.kubernetes.io/managed-by: pump
  annotations: {}
spec:
  selector:
    app.kubernetes.io/name: billing-api
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  type: ClusterIP
