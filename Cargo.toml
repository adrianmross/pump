[package]
name = "pump"
version = "0.2.0"
edition = "2024"
description = "Sparse config hydration for JSON/YAML manifests"
license = "MIT"
repository = "https://github.com/adrianmross/pump"
homepage = "https://github.com/adrianmross/pump"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
saphyr = "0.0.6"
saphyr-parser = "0.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
similar = "2.7"

[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
dist-version = "0.31.0"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Customize the Homebrew formula name
formula = "pump"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Trigger releases manually from GitHub Actions so publishing remains explicit.
dispatch-releases = true
# Where to host releases
hosting = "github"
